name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main   # ganti jika branch utama Anda 'master'
  workflow_dispatch:  # agar bisa di-trigger manual dari tab Actions

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            echo "🚀 Mulai deploy..."
            cd ${{ secrets.APP_DIR }}
            git fetch --all
            git reset --hard origin/main
            git pull origin main
            echo "✅ Kode berhasil ditarik"
            # Tidak perlu restart service untuk website statis
